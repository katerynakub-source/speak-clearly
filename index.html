   LAYOUT: cobalt header with 30-cell progress strip, tabs, then one calm column of steps. */
:root{color-scheme:light;--bg:#ffffff;--ink:#12131a;--mute:#5a5f73;--co:#2b45e0;--coDeep:#1f33b0;--on:#fff;--pan:#eef1ff;--line:#d9def5;--ac:#ff5a3c}

:root[data-theme=dark]{color-scheme:dark;--bg:#0e1124;--ink:#eef0ff;--mute:#a3a9c9;--co:#7186ff;--coDeep:#1b2366;--pan:#181d3c;--line:#2a3160}
html{background:#ffffff;background:var(--bg)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{background:var(--coDeep);color:var(--on);padding:28px max(5vw,16px) 0}
.hwrap,.wrap{max-width:980px;margin:0 auto}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.sub{opacity:.85;margin:8px 0 18px;max-width:60ch}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;margin-bottom:6px}
.strip i{height:14px;border-radius:3px;background:rgba(255,255,255,.18)}
.strip i.d{background:#fff}.strip i.p{background:rgba(255,255,255,.55)}.strip i.c{outline:2px solid var(--ac);outline-offset:1px}
.stripnote{font-size:13px;opacity:.85;margin-bottom:14px}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{flex:none;color:var(--on);text-decoration:none;padding:12px 16px;border-radius:10px 10px 0 0;font-weight:500;opacity:.85}
nav a.on{background:var(--bg);color:var(--ink);opacity:1}
main{padding:24px max(5vw,16px) 64px}
h2{font-size:28px;line-height:1.15;margin:0 0 6px;font-weight:800;text-wrap:balance}
h3{font-size:19px;margin:0 0 6px}
.meta{color:var(--mute);margin:0 0 18px}
.step{border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pan);color:var(--co);font-weight:800}
.step.dn .num{background:var(--co);color:#fff}
.big{font-size:21px;line-height:1.45;font-weight:500;background:var(--pan);padding:14px 16px;border-radius:12px;margin:10px 0;white-space:pre-line}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.btn.pri{background:var(--co);border-color:var(--co);color:#fff}
.btn.hot{background:var(--ac);border-color:var(--ac);color:#fff}
.btn[aria-pressed=true]{background:var(--co);color:#fff;border-color:var(--co)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:500;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--co)}
.say{display:none}.has-tts .say{display:inline-flex}
.ph{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.ph b{font-size:20px}.ph .ru{color:var(--mute)}.ph .ipa{color:var(--mute);font-size:15px;margin-left:6px}
.ph .ex{margin:6px 0 2px;font-style:italic}.ph .when{font-size:14px;color:var(--mute)}

.speak{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start;margin-top:10px}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.ring.run circle.fg{stroke:var(--ac)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);font-size:16px;resize:vertical}
.partial{color:var(--mute);font-style:italic;min-height:1.5em;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--pan);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stats span{font-size:13px;color:var(--mute)}
.flags{font-size:14px;color:var(--mute)}.flags mark{background:none;color:var(--ac);font-weight:700}
.check li{list-style:none;margin:4px 0}.check{padding:0}
.week{margin:24px 0}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.days button{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;padding:8px 10px}
.days button small{display:block;color:var(--mute);font-size:13px}
.days button.d{background:var(--co);color:#fff;border-color:var(--co)}.days button.d small{color:#dfe4ff}
.days button.p{border-color:var(--co);border-width:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.decks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:12px 0}.decks .btn{flex:none}
input[type=search],input.ans{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);width:100%;max-width:420px;font-size:16px}
.plist .ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.plist .ph.k{opacity:.6}
.quiz{max-width:560px;border:2px solid var(--co);border-radius:16px;padding:22px;margin-top:12px}
.quiz .q{font-size:24px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:15px;margin-top:10px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--mute)}
.src a{color:var(--co)}
.empty{color:var(--mute);padding:12px 0}
.status{font-size:13px;color:var(--mute);margin-top:6px}
.more{margin-top:12px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:18px 0}
.flow a{display:block;text-decoration:none;color:inherit;background:var(--pan);border-radius:12px;padding:12px 14px;border-top:4px solid var(--co)}
.flow a:nth-child(6),.flow a:nth-child(7){border-top-color:var(--ac)}
.flow b{display:block}.flow span{font-size:14px;color:var(--mute)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.sty{border:1px solid var(--line);border-radius:14px;padding:16px}.sty h3{margin:0 0 6px}.sty p{margin:6px 0;font-size:15px}.sty .note{margin:0;font-weight:700;color:var(--co)}
.week{scroll-margin-top:16px}
@media(max-width:600px){.speak{grid-template-columns:minmax(0,1fr)}.ring{margin:0 auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.step{grid-template-columns:minmax(0,1fr)}.num{width:34px;height:34px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{border:0;padding:2px 0;text-align:left}}
@media(prefers-reduced-motion:no-preference){.ring circle.fg{transition:stroke-dashoffset .25s linear}}
</style>
</head>

/* ---- browser speech recognition, used when the page runs outside Claude ---- */
function browserDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,want=false,cb={p:()=>{},f:()=>{},s:()=>{}};
  const make=()=>{const r=new SR();r.lang="en-US";r.continuous=true;r.interimResults=true;
    r.onresult=e=>{let part="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)cb.f({text:x[0].transcript.trim()});else part+=x[0].transcript}cb.p({text:part})};
    r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){want=false;cb.s({state:"idle",reason:"not_granted"})}};
    r.onend=()=>{if(want){try{r.start()}catch(x){want=false;cb.s({state:"idle",reason:"stopped"})}}else cb.s({state:"idle",reason:"stopped"})};
    return r};
  return{
    start(){want=true;rec=rec||make();try{rec.start()}catch(x){}cb.s({state:"listening"});return Promise.resolve()},
    stop(){want=false;try{rec&&rec.stop()}catch(x){}return Promise.resolve()},
    onPartial(f){cb.p=f},onFinal(f){cb.f=f},onState(f){cb.s=f}};
}

/* ---- timer ---- */
let T={len:60,left:60,id:null,start:0};
function ringHTML(){return `<div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--pan)" stroke-width="10"/><circle class="fg" cx="60" cy="60" r="54" fill="none" stroke="var(--co)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0" id="arc"/></svg><div class="t" id="tt"></div></div>`}
function drawT(){const a=$("#arc"),t=$("#tt");if(!a)return;a.style.strokeDashoffset=339.3*(1-T.left/T.len);const s=Math.max(0,Math.ceil(T.left));t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");$("#ring").classList.toggle("run",!!T.id)}
function stopT(){clearInterval(T.id);T.id=null;drawT();const b=$("#go");if(b)b.textContent="Start"}
function startT(){
  if(T.id){stopT();if(dict&&listening)dict.stop().catch(()=>{});return}
  if(T.left<=0)T.left=T.len;
  T.start=Date.now()-(T.len-T.left)*1000;
  T.id=setInterval(()=>{T.left=T.len-(Date.now()-T.start)/1000;if(T.left<=0){T.left=0;stopT();if(dict&&listening)dict.stop().catch(()=>{})}drawT();analyse()},250);
  $("#go").textContent="Pause";drawT();
}
function setLen(s){stopT();T.len=s;T.left=s;drawT();document.querySelectorAll("[data-len]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.len===s))}
function elapsed(){return Math.max(1,T.len-T.left)}

function analyse(){
  const tx=$("#tx");if(!tx)return;const v=tx.value.trim();
  const words=v?v.split(/\s+/).length:0;
  const f=(v.match(FILL)||[]),g=(v.match(VAGUE)||[]);
  const sec=elapsed();const wpm=words&&sec>5?Math.round(words/(sec/60)):0;
  $("#sw").textContent=words;$("#sp").textContent=wpm||"—";$("#sf").textContent=f.length;$("#sv").textContent=g.length;
  const tip=!wpm?"":wpm<100?"A bit slow — you can add some energy.":wpm>170?"Fast — add some pauses.":"Good pace.";
  const u=a=>esc([...new Set(a.map(x=>x.toLowerCase()))].join(", "));
  $("#flags").innerHTML=(tip?esc(tip)+" ":"")+(f.length?"Fillers: <mark>"+u(f)+"</mark>. ":"")+(g.length?"Vague words: <mark>"+u(g)+"</mark>.":"");
  return{w:words,wpm,f:f.length,v:g.length,s:Math.round(sec)};
}

  <div class="row"><span class="note">Time:</span>${[[30,"30 sec"],[60,"1 min"],[90,"1.5 min"],[120,"2 min"]].map(([s,l])=>`<button class="btn" data-len="${s}" aria-pressed="${s===T.len}">${l}</button>`).join("")}${mode==="st"?`<button class="btn" id="sitd">Daily situation</button><button class="btn" id="sitp">Event situation</button>`:day?"":`<button class="btn" id="rnd">Random topic</button><button class="btn" id="rndw">Work topic</button>`}</div>
  <div class="speak">${ringHTML()}<div>
    <div class="row"><button class="btn hot" id="go">Start</button><button class="btn" id="mic" aria-pressed="false" hidden>Record speech</button><button class="btn" id="reset">Reset</button></div>
    <p class="note" id="micnote">Speak out loud. If recording isn't available, type a short version of what you said after the timer — the counters will update.</p>
    <textarea id="tx" placeholder="Your speech will appear here…"></textarea>
    <div class="partial" id="txp"></div>
    <div class="stats"><div><b id="sw">0</b><span>words</span></div><div><b id="sp">—</b><span>words / min</span></div><div><b id="sf">0</b><span>fillers</span></div><div><b id="sv">0</b><span>vague words</span></div></div>
    <div class="flags" id="flags"></div>
    ${checks?`<h3 style="margin-top:14px">Self-check</h3><ul class="check">${checks.map(c=>`<li><label class="chk"><input type="checkbox">${esc(c)}</label></li>`).join("")}</ul>`:""}
    <button class="btn pri" id="savelog" data-day="${day}">Save attempt</button> <span class="status" id="saved"></span>
  </div></div>`;
}
function bindSpeak(){
  T.left=T.len;drawT();
  document.querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>setLen(+b.dataset.len));
  $("#go").onclick=()=>{if(dict&&!T.id&&!listening)dict.start().catch(()=>{});startT()};
  const mic=$("#mic");
  if(dict){mic.hidden=false;$("#micnote").textContent=MICNOTE}
  mic.onclick=()=>{if(listening){dict.stop().catch(()=>{})}else{dict.start().catch(e=>{if(e&&e.code==="not_granted")mic.hidden=true})}};
  $("#reset").onclick=()=>{stopT();if(dict&&listening)dict.stop().catch(()=>{});T.left=T.len;drawT();$("#tx").value="";analyse()};
  $("#tx").oninput=analyse;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const r=$("#rnd");if(r)r.onclick=()=>{$("#prompt").textContent=pick(RANDOM)};
  const rw=$("#rndw");if(rw)rw.onclick=()=>{$("#prompt").textContent=pick(ENGTOPICS)};
  for(const c of ["d","p"]){const b=$("#sit"+c);if(b)b.onclick=()=>{$("#prompt").textContent=pick(SIT[c])+" Open, ask two follow-ups, then exit gracefully."}}
  $("#savelog").onclick=e=>{const a=analyse();if(!a.w){$("#saved").textContent="Say or type at least a couple of sentences first.";return}
    S.logs.unshift({d:+e.target.dataset.day,ts:Date.now(),...a});S.logs=S.logs.slice(0,200);persist();$("#saved").textContent="Saved ✓";renderHead()};
  analyse();
}

function sayText(p){return p[0]+(p[2]?". "+p[2]:"")}
function itemBody(p,deck,brief){
  return `<b>${esc(p[0])}</b>${p[4]?`<span class="ipa">${esc(p[4])}</span>`:""}<span class="tag">${esc(p[5]||DK[deck].t)}</span>
  <div class="ru">${esc(p[1])}</div>${brief?"":`${p[2]?`<div class="ex">${esc(p[2])}</div>`:""}${p[3]?`<div class="ru">${esc(p[3])}</div>`:""}${p[6]?`<div class="when">When: ${esc(p[6])}</div>`:""}`}`}
function phCard(deck,i,brief){const p=DK[deck].items[i];if(!p)return "";return `<div class="ph">${itemBody(p,deck,brief)} <div class="row more"><button class="btn sm say" data-say="${esc(sayText(p))}">▶ Listen</button></div></div>`}

/* ---- views ---- */
function vToday(){
  const n=S.sel||curDay(),w=WEEKS[wk(n)],d=doneOf(n),dr=DR[n-1],wm=WARM[(n-1)%4],vo=dayVocab(n),rev=n>25;
  const st=(i,title,body)=>`<section class="step${d.includes(i)?" dn":""}"><div class="num">${i+1}</div><div><h3>${title}</h3>${body}<label class="chk"><input type="checkbox" data-step="${i}" ${d.includes(i)?"checked":""}>Done</label></div></section>`;
  const drillSay=esc(dr[2].replace(/\n/g," ").replace(/→/g,". "));
  return `<div class="row" style="justify-content:space-between"><button class="btn" id="prev" ${n<=1?"disabled":""}>← Day ${n-1||""}</button><button class="btn" id="next" ${n>=30?"disabled":""}>Day ${n<30?n+1:""} →</button></div>
  <h2 style="margin-top:16px">Day ${n} · ${esc(w.t)}</h2><p class="meta">${esc(w.n)}. ${esc(w.f)}</p>
  ${st(0,"Warm-up · 2 min: "+esc(wm.t),`<p>${esc(wm.h)}</p>`)}
  ${st(1,"Diction · 3 min: "+esc(dr[0]),`<p>${esc(dr[1])}</p><p class="big">${esc(dr[2])}</p><div class="row"><button class="btn say" data-say="${drillSay}">▶ Listen</button><button class="btn say" data-say="${drillSay}" data-rate="0.75">▶ Slowly</button></div>`)}
  ${st(2,(rev?"Vocabulary review":"Vocabulary of the day")+" · 5 min",`<p>${rev&&LIVE.length?"Cover the translation and recall the meaning. Then make your own sentence with each phrase.":"Shadowing: listen, repeat 3 times in the same rhythm, then make your own sentence about your life."}</p>
    <h3 style="margin-top:14px;font-size:16px">${!LIVE.length?"Small talk":rev?"Review: 50 Live Phrases":"Live phrases"}</h3>${vo.map(v=>phCard(v[0],v[1],rev&&v[0]==="live")).join("")}
    <h3 style="margin-top:14px;font-size:16px">Engineering management</h3>${dayEng(n).map(i=>phCard("eng",i)).join("")}
    ${DK.phrasal?`<h3 style="margin-top:14px;font-size:16px">Phrasal verb</h3>${phCard("phrasal",n-1)}`:""}
    ${DK.beautiful?`<h3 style="margin-top:14px;font-size:16px">Beautiful word</h3>${phCard("beautiful",n-1)}`:""}`)}
  ${st(3,"Speak · 5 min",`<p>${wk(n)===3?"15 seconds to prepare, then talk without stopping.":"Decide on your main idea, press Start and talk until the timer ends."} Try to use a phrase of the day.</p>${speakBlock(PR[n-1],n,w.c)}`)}`;
}
function vPlan(){
  const c=curDay();
  return `<h2>The 30-day plan</h2><p class="meta">Every day has 4 steps, about 15 minutes. Tap a day to open it.</p>
  ${WEEKS.map((w,wi)=>{const ds=[];for(let n=1;n<=30;n++)if(wk(n)===wi)ds.push(n);
    return `<div class="week"><h3>${esc(w.n)}: ${esc(w.t)}</h3><p class="note">${esc(w.f)}</p><div class="days">${ds.map(n=>`<button data-day="${n}" class="${full(n)?"d":doneOf(n).length?"p":""}">Day ${n}<small>${full(n)?"done":n===c?"today":doneOf(n).length?doneOf(n).length+" of 4":esc(DR[n-1][0])}</small></button>`).join("")}</div></div>`}).join("")}
  <div class="week" id="sync"><h3>Move your progress to another device</h3>
  <p class="note">Copy your progress code here, then paste it into the app on your other device and press Import. It carries finished days, known words and saved attempts.</p>
  <div class="row"><button class="btn pri" id="exp">Copy progress code</button><button class="btn" id="imp">Import code</button></div>
  <textarea id="pcode" placeholder="Paste a progress code here, then press Import" style="min-height:80px;margin-top:10px"></textarea>
  <p class="status" id="pmsg"></p></div>
  <div class="src"><h3>Where the method comes from</h3><p class="note">Exercises are written from scratch, inspired by open programmes: <a href="https://articulatemethod.com/lessons">Articulate Method</a> (30 days, pauses, one idea in 60–90 seconds), <a href="https://getlucidly.app/blog/articulation-training-for-adults.html">Lucidly</a> (4 weeks: sounds → point first → precision → pressure), <a href="https://theelocutionacademy.com/course/elocution-essentials">The Elocution Academy</a> (breathing, intonation) and <a href="https://speakwithoraton.com/blog/articulation-training-9-exercises-to-improve-speech-clarity">Oraton</a> (shadowing, one-minute recordings).</p>
  <p class="note">Vocabulary decks: ${DECKS.map(d=>esc(d.t)+" — "+esc(d.src)).join("; ")}.</p></div>`;
}
let PF={deck:"live",g:"all",q:"",mode:"list",qi:null,show:false};
function vPhrases(){
  if(!DK[PF.deck])PF.deck=DECKS[0].id;
  const D=DK[PF.deck],groups=[...new Set(D.items.map(p=>p[5]).filter(Boolean))];
  if(PF.g!=="all"&&PF.g!=="new"&&!groups.includes(PF.g))PF.g="all";
  const key=i=>PF.deck+":"+i;
  const list=D.items.map((p,i)=>i).filter(i=>{const p=D.items[i];return (PF.g==="all"||(PF.g==="new"?!S.known[key(i)]:p[5]===PF.g))&&(!PF.q||(p[0]+" "+p[1]+" "+p[2]).toLowerCase().includes(PF.q.toLowerCase()))});
  const kn=D.items.filter((p,i)=>S.known[key(i)]).length,knAll=Object.keys(S.known).length;
  const chips=[["all","All"]].concat(groups.map(g=>[g,g[0].toUpperCase()+g.slice(1)])).concat([["new","Not learned yet"]]);
  let body;
  if(PF.mode==="list"){
    body=`<div class="plist">${list.map(i=>{const p=D.items[i],k=S.known[key(i)];return `<div class="ph${k?" k":""}"><div>${itemBody(p,PF.deck)}</div><div class="row" style="flex-direction:column;align-items:stretch"><button class="btn say" data-say="${esc(sayText(p))}" aria-label="Listen">▶</button><button class="btn" data-known="${i}" aria-pressed="${!!k}">${k?"Known ✓":"I know it"}</button></div></div>`}).join("")||'<p class="empty">Nothing found.</p>'}</div>`;
  }else{
    if(PF.qi===null||!list.includes(PF.qi))PF.qi=list.length?list[Math.floor(Math.random()*list.length)]:null;
    const p=PF.qi===null?null:D.items[PF.qi];
    body=p?`<div class="quiz"><p class="note">How do you say it in English?</p><p class="q">${esc(p[1])}</p>${p[6]?`<p class="note">When: ${esc(p[6])}</p>`:""}
      <input class="ans" id="ans" placeholder="Your answer (optional)" autocomplete="off">
      ${PF.show?`<p style="margin-top:14px"><b style="font-size:22px">${esc(p[0])}</b>${p[4]?` <span class="note">${esc(p[4])}</span>`:""} <button class="btn sm say" data-say="${esc(sayText(p))}">▶</button></p>${p[2]?`<p class="ex">${esc(p[2])}</p>`:""}<div class="row"><button class="btn pri" data-q="yes">I knew it</button><button class="btn" data-q="no">Still learning</button></div>`:`<div class="row" style="margin-top:12px"><button class="btn pri" id="reveal">Show answer</button></div>`}</div>`:'<p class="empty">Everything in this set is learned. Choose “All”.</p>';
  }
  return `<h2>Vocabulary</h2><p class="meta">${DECKS.length} decks, ${TOTAL} items. Learned: ${knAll} of ${TOTAL}.</p>
  <div class="decks">${DECKS.map(d=>`<button class="btn" data-deck="${d.id}" aria-pressed="${PF.deck===d.id}">${esc(d.t)}</button>`).join("")}</div>
  <p class="note">${esc(D.src)} · learned ${kn} of ${D.items.length}</p>
  <div class="row"><button class="btn" data-mode="list" aria-pressed="${PF.mode==="list"}">List</button><button class="btn" data-mode="quiz" aria-pressed="${PF.mode==="quiz"}">Flashcard quiz</button></div>
  <div class="chips">${chips.map(c=>`<button class="btn sm" data-g="${esc(c[0])}" aria-pressed="${PF.g===c[0]}">${esc(c[1])}</button>`).join("")}</div>
  ${PF.mode==="list"?`<input type="search" id="q" placeholder="Search this deck" value="${esc(PF.q)}">`:""}${body}`;
}
let STC="b";
function vSmall(){
  const ok=p=>STC==="b"||p[7]==="b"||p[7]===STC;
  const ctx=[["b","All"],["d","Daily life"],["p","Conferences & forums"]];
  return `<h2>Small talk</h2><p class="meta">Start, keep and end a conversation with ease — at a party or at a conference coffee break.</p>
  <div class="row">${ctx.map(c=>`<button class="btn" data-ctx="${c[0]}" aria-pressed="${STC===c[0]}">${c[1]}</button>`).join("")}</div>
  <div class="flow">${STAGES.map((s,i)=>`<a href="#smalltalk" data-jump="st${i}"><b>${i+1}. ${esc(s.s)}</b><span>${esc(s.h)}</span></a>`).join("")}</div>
  ${STAGES.map((s,i)=>{const items=ST.map((p,j)=>[p,j]).filter(([p])=>p[5]===s.s&&ok(p));if(!items.length)return "";
    return `<section class="week" id="st${i}"><h3>${i+1}. ${esc(s.s)}</h3><p class="note">${esc(s.h)}</p>${items.map(([p])=>`<div class="ph"><b>${esc(p[0])}</b><span class="tag">${p[7]==="d"?"daily":p[7]==="p"?"events":"anywhere"}</span><div class="ru">${esc(p[1])}</div><div class="when">${esc(p[6])}</div><div class="row more"><button class="btn sm say" data-say="${esc(p[0])}">▶ Listen</button></div></div>`).join("")}</section>`}).join("")}
  <section class="week"><h3>Learn from great speakers</h3><p class="note">How well-known speakers deliver ideas — each with a 1-minute drill and a small-talk tip. Techniques are general observations; not affiliated with or endorsed by these people.</p>
  <div class="styles">${STYLES.map(s=>`<article class="sty"><p class="note">${esc(s.n)}</p><h3>${esc(s.t)}</h3><p>${esc(s.how)}</p><p><b>Drill:</b> ${esc(s.drill)}</p><p><b>In small talk:</b> ${esc(s.st)}</p><button class="btn sm say" data-say="${esc(s.drill)}">▶ Listen to the drill</button></article>`).join("")}</div></section>
  <section class="week"><h3>Practise a conversation</h3><p class="note">Pick a situation and say your side out loud: opener, two follow-up questions, a short story of your own, a graceful exit.</p>
  ${speakBlock(SIT.p[0]+" Open, ask two follow-ups, then exit gracefully.",0,["Opened within 5 seconds","Used their name","Asked two follow-up questions","Shared a short story or detail","Exited warmly with a next step"],"st")}</section>`;
}
function vPractice(){
  const L=S.logs.slice(0,30);
  return `<h2>Free practice</h2><p class="meta">Pick a random topic and talk for 60–90 seconds. The numbers show your progress.</p>
  ${speakBlock(RANDOM[Math.floor(Math.random()*RANDOM.length)],0,null)}
  <h3 style="margin-top:28px">Attempt history</h3>${L.length?`<table class="stack"><thead><tr><th>Date</th><th>Day</th><th class="n">Sec</th><th class="n">Words</th><th class="n">Words/min</th><th class="n">Fillers</th></tr></thead><tbody>${L.map(l=>`<tr><td>${new Date(l.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</td><td>${l.d?"Day "+l.d:"Practice"}</td><td class="n">${l.s}</td><td class="n">${l.w}</td><td class="n">${l.wpm||"—"}</td><td class="n">${l.f}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">No saved attempts yet.</p>'}`;
}

function renderHead(){
  const c=curDay(),dn=Object.keys(S.done).filter(n=>full(+n)).length;
  $("#strip").innerHTML=Array.from({length:30},(_,i)=>`<i class="${full(i+1)?"d":doneOf(i+1).length?"p":""}${i+1===(S.sel||c)?" c":""}" title="Day ${i+1}"></i>`).join("");
  $("#stripnote").textContent=`Days done: ${dn} of 30 · talks saved: ${S.logs.length} · ${dbStatus}`;
}
function route(){
  const h=(location.hash||"#today").slice(1);const v=["today","plan","phrases","smalltalk","practice"].includes(h)?h:"today";
  stopT();if(dict&&listening)dict.stop().catch(()=>{});
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+v));
  $("#view").innerHTML=v==="today"?vToday():v==="plan"?vPlan():v==="phrases"?vPhrases():v==="smalltalk"?vSmall():vPractice();
  if($("#tx"))bindSpeak();
  renderHead();
}
document.addEventListener("click",e=>{
  const j=e.target.closest("a[data-jump]");if(j){e.preventDefault();const s=document.getElementById(j.dataset.jump);if(s)s.scrollIntoView({behavior:"smooth"});return}
  const t=e.target.closest("button,input");if(!t)return;
  if(t.dataset.ctx){STC=t.dataset.ctx;route();return}
  if(t.id==="exp"){const code="SC1."+btoa(unescape(encodeURIComponent(JSON.stringify(S))));const a=$("#pcode");a.value=code;a.select();
    const ok=()=>{$("#pmsg").textContent="Code copied. Paste it into the app on your other device."};
    try{navigator.clipboard.writeText(code).then(ok,()=>{$("#pmsg").textContent="Code selected — copy it from the box."})}catch(x){$("#pmsg").textContent="Code selected — copy it from the box."}return}
  if(t.id==="imp"){const v=$("#pcode").value.trim();
    try{if(!v.startsWith("SC1."))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(typeof o!=="object"||!o.done)throw 0;
      S=fix({done:o.done||{},known:o.known||{},logs:Array.isArray(o.logs)?o.logs.slice(0,200):[],sel:+o.sel||0});persist();route();location.hash="#plan";const m=$("#pmsg");if(m)m.textContent="Progress imported ✓"}
    catch(x){$("#pmsg").textContent="That doesn't look like a progress code. Copy it again from the other device."}return}
  if(t.dataset.say){say(t.dataset.say,+t.dataset.rate||1);return}
  if(t.dataset.step!==undefined){const n=S.sel||curDay(),i=+t.dataset.step,a=new Set(doneOf(n));t.checked?a.add(i):a.delete(i);S.done[n]=[...a];S.sel=n;persist();t.closest(".step").classList.toggle("dn",t.checked);renderHead();return}
  if(t.id==="prev"||t.id==="next"){S.sel=(S.sel||curDay())+(t.id==="next"?1:-1);persist();route();scrollTo(0,0);return}
  if(t.dataset.day&&t.closest(".days")){S.sel=+t.dataset.day;persist();location.hash="#today";if(location.hash==="#today")route();scrollTo(0,0);return}
  if(t.dataset.known){const k=PF.deck+":"+t.dataset.known;S.known[k]?delete S.known[k]:S.known[k]=1;persist();route();return}
  if(t.dataset.deck){PF.deck=t.dataset.deck;PF.g="all";PF.q="";PF.qi=null;PF.show=false;route();return}
  if(t.dataset.mode){PF.mode=t.dataset.mode;PF.show=false;route();return}
  if(t.dataset.g){PF.g=t.dataset.g;PF.qi=null;PF.show=false;route();return}
  if(t.id==="reveal"){PF.show=true;route();return}
  if(t.dataset.q){const k=PF.deck+":"+PF.qi;if(t.dataset.q==="yes")S.known[k]=1;else delete S.known[k];persist();PF.qi=null;PF.show=false;route();return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){PF.q=e.target.value;const pos=e.target.selectionStart;route();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
addEventListener("hashchange",route);
route();

/* ---- capabilities: light up when available ---- */
if(inClaude){
  claude.use("tts").then(t=>{if(t){tts=t;document.body.classList.add("has-tts")}}).catch(()=>{});
  claude.use("dictation").then(d=>{if(d){dict=d;onDict();const m=$("#mic");if(m){m.hidden=false;$("#micnote").textContent=MICNOTE}}}).catch(()=>{});
  Promise.all([claude.use("db"),claude.use("user")]).then(async([db,user])=>{
    if(!db||!user)return;const id=await user.id();if(!id)return;
    const ref=db.collection("data/users/"+id).doc("progress");
    const snap=await ref.get();
    if(snap.exists)S=fix(Object.assign({done:{},known:{},logs:[],sel:0},JSON.parse(JSON.stringify(snap.data()))));
    dbRef=ref;dbStatus="Progress is saved to your account.";
    if(!snap.exists)persist();
    route();
  }).catch(()=>{});
}
}
</script>
</body>
</html>
